[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmedm-vb"
description = "Penalized Maximum Entropy Dasymetric Modeling as a variational Bayes problem"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "requests",
]

# torch is deliberately NOT a hard dependency. On ISAAC it comes from conda
# (see environment.yml) so that the CUDA-linked build is the one that gets
# imported; listing it here would invite pip to install a wheel over the top
# of it. This extra exists only for a pip-only install on a laptop.
[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest"]

[tool.hatch.version]
path = "src/pmedm_vb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pmedm_vb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
