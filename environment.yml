# Conda owns the interpreter and every compiled dependency; pyproject owns the
# package itself. Keeping all binary artifacts from one solver is what avoids
# mixed conda/pip ABI breakage, and it is the path that gets a CUDA-linked
# PyTorch on ISAAC.
#
# On ISAAC-NG, from inside the clone:
#
#     PROJ=$(dirname "$PWD")
#     module purge
#     source /sw/isaac/applications/anaconda3/2024.06/\
#            rhel8_cascadelake_binary/anaconda3-2024.06/etc/profile.d/conda.sh
#     # NB: source the hook directly; do NOT `module load anaconda3`, which
#     # prepends its own bin to PATH and shadows the environment's python.
#     conda --version                         # expect >= 23.10 (libmamba solver)
#     export CONDA_PKGS_DIRS=$PROJ/conda_pkgs
#     conda env create -f environment.yml --prefix $PROJ/envs/pmedm_vb
#     conda activate $PROJ/envs/pmedm_vb
#     python -c "import sys; print(sys.executable)"   # MUST be in $CONDA_PREFIX
#     $CONDA_PREFIX/bin/python -m pip install -e . --no-deps
#
# --no-deps because conda has already satisfied everything below. The editable
# install is the analogue of devtools::load_all(): edits to src/ take effect
# without reinstalling.
#
# The 2024.06 module matters: libmamba became conda's default solver in 23.10.0,
# and the 2021.05 default module predates it. Nothing large may land in a quota'd
# home directory, which needs all three of --prefix (the environment),
# CONDA_PKGS_DIRS (the tarball cache, which --prefix does not move) and
# PMEDM_VB_DATA (the download cache, which otherwise defaults to ./data).
# See README.md for the full explanation.
name: pmedm_vb
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pytorch
  - numpy
  - scipy
  - pandas
  - pyarrow
  - requests
  - pytest
  # Required. Conda's `python` package does not pull pip in, and without it a
  # bare `pip` falls through PATH to the module's base Anaconda pip -- which
  # writes to the wrong site-packages and is too old for PEP 660 editable
  # installs of a pyproject-only project (needs pip >= 21.3).
  - pip
